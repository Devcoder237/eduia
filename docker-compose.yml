# Environnement de DÉVELOPPEMENT local (PostgreSQL + API + front Vite).
# Usage : cp .env.example .env  (renseigner SECRET_KEY et OPENAI_API_KEY)  puis  make up
# Ce fichier n'est PAS utilisé en production (Render + Neon + Cloudflare Pages).
name: eduia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduia
      POSTGRES_PASSWORD: eduia-dev-only
      POSTGRES_DB: eduia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduia -d eduia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:?Générez-la avec: python backend/scripts/generate_secret.py}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://eduia:eduia-dev-only@db:5432/eduia
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
