[project]
name = "eduia-backend"
version = "2.0.0"
description = "EduIA — tuteur intelligent adaptatif pour apprenants camerounais (API FastAPI)"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = [
  "S101",   # assert : autorisé dans les tests
  "B008",   # Depends() dans les valeurs par défaut : idiome FastAPI
  "E501",   # longueur de ligne gérée par le formateur
]

[tool.ruff.lint.isort]
# Le dossier « alembic/ » du projet masque la bibliothèque du même nom : sans ceci, selon la version de
# ruff, l'import est classé « première partie » et l'ordre des imports diffère d'un poste à l'autre.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"scripts/*" = ["S608"]
