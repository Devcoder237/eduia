# Intégration continue. Dépôt PUBLIC => minutes GitHub Actions gratuites et illimitées.
name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123456789
      DATABASE_URL: sqlite+aiosqlite:///:memory:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (pytest + migrations Alembic)
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Audit des dépendances
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      VITE_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pas de package-lock fourni : `npm install` en génère un. Committez-le ensuite, puis repassez à `npm ci`.
      - run: npm install
      - name: Types (tsc strict)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: eduia-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage + healthcheck (SQLite interdit en prod => base Postgres jetable)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=eduia -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker run -d --name api --network host \
            -e SECRET_KEY=ci-only-secret-key-ci-only-secret-key-0123456789 \
            -e DATABASE_URL=postgresql://postgres:ci@127.0.0.1:5432/eduia \
            -e CORS_ORIGINS=http://localhost:5173 eduia-api:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
